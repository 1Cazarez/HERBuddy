<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herbuddy - Campus Safety, Wellness & Pickups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        deepIndigo: '#10002B',
                        darkPurple: '#240046',
                        electricPurple: '#7B2CBF',
                        deepViolet: '#3A0CA3',
                        radiantPink: '#E01E5A',
                        neonPink: '#FF2E93',
                        softPinkBg: '#FFE5F1'
                    },
                    boxShadow: {
                        'neon-pink': '0 0 25px rgba(255, 46, 147, 0.45)',
                        'neon-purple': '0 0 25px rgba(123, 44, 191, 0.45)',
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen flex justify-center items-center p-0 sm:p-4 md:p-6 select-none overflow-x-hidden">

    <div class="w-full max-w-md h-screen md:h-[920px] bg-deepIndigo sm:rounded-[44px] shadow-neon-purple overflow-hidden flex flex-col relative border-0 sm:border-[8px] border-slate-900">

        <hb-device-header></hb-device-header>
        <hb-toast></hb-toast>
        <hb-active-walk-banner></hb-active-walk-banner>

        <div id="herbuddy-app-container" class="flex-1 flex flex-col relative bg-deepIndigo">
            <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar relative px-4 pb-20 pt-2 space-y-4">
                <hb-login-screen></hb-login-screen>
                <hb-tab-home></hb-tab-home>
                <hb-tab-find></hb-tab-find>
                <hb-tab-wellness></hb-tab-wellness>
                <hb-tab-chat></hb-tab-chat>
                <hb-tab-create></hb-tab-create>
                <hb-tab-pickup></hb-tab-pickup>
                <hb-tab-profile></hb-tab-profile>
            </main>

            <hb-nav-bar></hb-nav-bar>
        </div>
    </div>

    <hb-edit-profile-modal></hb-edit-profile-modal>
    <hb-errand-modal></hb-errand-modal>

    <script type="module" src="js/main.js"></script>
</body>
</html>
